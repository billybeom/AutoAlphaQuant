# AutoAlphaQuant — melos 워크스페이스 설정
#
# 이 파일이 하는 일: 여러 패키지(packages/·apps/)를 한 저장소에서 한꺼번에
# 가져오고(bootstrap), 분석하고, 테스트하고, 경계 규칙을 검사한다.
#
# 🔴 명령은 이 저장소 루트에서 실행한다. 개별 패키지에서 `flutter pub get`을
#    직접 부르지 말 것 — 경로 의존(path dependency) 연결이 melos 몫이다.
#
# ✅ 실측(2026-09-08 · G3 통합): Dart 3.13.2 / Flutter 3.47.2 / 저장소 안 melos
#    6.3.3. `bootstrap` → `build:gen` → `analyze` → `format` 이 13패키지 전부
#    SUCCESS 였다. 실행 방식은 Git Bash에서
#      export PATH="/c/src/flutter/bin:/c/Users/BeomLee/AppData/Local/Pub/Cache/bin:$PATH"
#      cd "C:/Work/Bob/AutoAlphaQuant" && melos.bat run <script>
#    (`melos`는 이 PC에 .bat만 있다 — docs/toolchain_notes.md §1.)

name: autoalphaquant

packages:
  - packages/**
  - apps/**

ignore:
  - "**/build/**"
  - "**/.dart_tool/**"

# ⚠️ 방식 선택은 **고전 `packages:` 글롭 하나로 유지한다**(위 목록).
#    melos 6.3.3 + Dart 3.13이면 pub workspace(루트 pubspec의 `workspace:` 목록
#    + 각 패키지의 `resolution: workspace`) 방식도 쓸 수 있지만, 지금 글롭 방식이
#    13패키지 전부 실측 통과했으므로 옮기지 않는다 — 옮기려면 13개 pubspec을
#    한 커밋에서 함께 고쳐야 하고, 🔴 **두 방식을 섞으면 bootstrap이 조용히 다른
#    pubspec을 읽는다.** (SETUP §4-6)

command:
  bootstrap:
    runPubGetInParallel: true

scripts:
  # ── 일상 검사 ─────────────────────────────────────────────────────────────
  analyze:
    description: 전 패키지 정적 분석. 경고 0이 병합 조건이다(07 §9 기계 검사 5).
    exec: dart analyze . --fatal-infos

  format:
    description: >-
      포맷 검사. 고치지 않고 어긋난 파일이 있으면 실패한다.
      ⚠️ CI에서는 build:gen 뒤에 돌기 때문에 *.g.dart·*.freezed.dart 도 검사 대상이다.
      생성기와 포매터가 같은 SDK를 쓰면 문제가 없지만, 만약 «우리가 쓰지 않은 파일»
      때문에 이 게이트가 실패하기 시작하면 그때는 규칙을 끄지 말고 검사 대상에서
      생성물을 빼라(커밋된 .dart 파일만 넘기는 형태). 고칠 수 없는 조건으로 점검을
      실패시키지 않는다.
    run: dart format --output=none --set-exit-if-changed .

  format:fix:
    description: 포맷을 실제로 고친다(로컬 전용).
    run: dart format .

  # ── 테스트 ────────────────────────────────────────────────────────────────
  test:
    description: 순수 Dart 패키지와 Flutter 패키지 테스트를 모두 돌린다.
    run: melos run test:dart && melos run test:flutter

  test:dart:
    description: 순수 Dart 패키지(domain_contracts·core_engine 등) 테스트.
    exec: dart test
    packageFilters:
      flutter: false
      dirExists: test

  test:flutter:
    description: Flutter 패키지(ui_*·apps/*) 테스트.
    exec: flutter test
    packageFilters:
      flutter: true
      dirExists: test

  # ── 경계 규칙 강제 ────────────────────────────────────────────────────────
  check:boundaries:
    description: >
      의존 경계 검사(01 §1-1 · 00_README §5). ui_*가 core_engine·decimal·
      broker_gateway·trading_runtime·data_sync·sqflite·supabase·http를 의존하거나
      import하면 실패한다(C-3). 한글 리터럴은 경고만 낸다(C-5 보조).
    run: bash tool/check_boundaries.sh

  check:labels:
    description: >
      C-5 보조 스캐너(01 §1-5 · §7 C-5). ui_* 전 파일에서 한글 문자열 리터럴과
      'TIER '·'SAF-' 리터럴, 월 납입 금액 리터럴(C-32 보조)을 찾는다.
      🔴 보조다 — C-5 의 정본 구현은 domain_contracts/test/ 의 계약 테스트이며
      여기서 통과했다고 C-5 를 대신하지 않는다. 반대로 여기서 걸린 것은 진짜다.
    run: bash packages/domain_contracts/tool/check_labels.sh

  # ── 골든 스냅샷 ───────────────────────────────────────────────────────────
  golden:verify:
    description: >
      골든 스냅샷 검증. 뷰모델 골든(*.golden.json, C-1)과 위젯 골든 PNG(C-2)를
      현재 코드로 재생성하지 않고 비교만 한다. 🔴 실패했다고 스냅샷을 다시 찍지
      말 것 — 표시 계약이 바뀌었다는 신호다(01 §7 골든 규칙).
    run: melos run test:dart && melos run test:flutter
    # ⚠️ 지금은 test와 같은 명령이다. 골든 테스트에 태그를 붙이기로 하면
    #    `--tags golden`으로 좁힌다. 태그 규약은 M2 계약 확정 시 정한다.

  test:contracts:
    description: >
      계약 회귀 테스트 C-1~C-32(01 §7). 07 §9 병합 검사의 {{SNAPSHOT_CMD}}가
      이 스크립트다.
    run: melos run check:boundaries && melos run check:labels && melos run golden:verify
    # ✅ 실측(2026-09-08 · G3 확정): C-1~C-32 가 **전부 이 스크립트로 돈다** —
    #    golden:verify 가 test:dart 를 부르고, 거기서 domain_contracts/test/contracts/
    #    34파일이 실행된다(204 케이스 = 170 통과 · 34 skip · 0 실패).
    # 🔴 34 skip 은 «미구현»이 아니라 «아직 검사할 대상이 없다»(ui_* 화면 패키지·
    #    엔진 런타임·골든 파일 선행). 각 skip 은 테스트 안에 사유 문장을 달고 있고,
    #    같은 사유가 01 §7 «C-n 구현 상태» 열에 전건 기록돼 있다.
    #    🔴 skip 을 지우거나 통과로 바꾸지 말 것 — 화면 PR 이 그 자리를 채운다.

  # ── 코드 생성 ─────────────────────────────────────────────────────────────
  build:gen:
    description: >
      freezed·json_serializable 생성 코드를 만든다. 생성물(*.freezed.dart·
      *.g.dart)은 .gitignore에 있으므로 clone 직후와 CI에서 한 번 돌려야 한다.
    # 🔴 `--delete-conflicting-outputs` 를 붙이지 않는다 — build_runner 2.16에서
    #    **제거**된 플래그라 경고(`These options have been removed and were
    #    ignored`)만 남기고 아무 일도 하지 않는다(docs/toolchain_notes.md §5 #4).
    exec: dart run build_runner build
    packageFilters:
      dependsOn:
        - build_runner
