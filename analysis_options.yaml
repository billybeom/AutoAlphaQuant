# AutoAlphaQuant — 저장소 공통 분석 규칙
#
# 이 파일이 하는 일: 전 패키지가 공유하는 정적 분석 기준선. 각 패키지의
# `analysis_options.yaml`은 이 파일 하나만 include 하고, 자기 패키지에만 필요한
# 예외를 그 아래에 덧붙인다.
#
#   # packages/<이름>/analysis_options.yaml
#   include: ../../analysis_options.yaml
#
# ⚠️ include 해석 주의: 아래 `package:flutter_lints/...` 는 **그 패키지의**
#    package config로 해석된다. 그래서 순수 Dart 패키지(domain_contracts·
#    core_engine)도 dev_dependencies 에 `flutter_lints` 를 넣어야 한다.
#    flutter_lints 는 규칙 YAML만 담은 순수 Dart 패키지라 Flutter SDK를
#    끌어오지 않는다 — 넣어도 「순수 Dart」 원칙(01 §1-1)을 깨지 않는다.
#
# 🔴 여기 있는 규칙은 「취향」이 아니라 경계 규칙(00_README §5)의 일부다.
#    끄기 전에 그 규칙이 무엇을 막고 있었는지 먼저 확인할 것.

include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    # 암묵적 형변환·추론·raw 타입 금지. 계약 DTO의 타입이 조용히 dynamic으로
    # 뭉개지는 것을 막는다 — 화면이 잘못된 필드를 읽고도 컴파일되는 사고 방지.
    strict-casts: true
    strict-inference: true
    strict-raw-types: true

  exclude:
    # 생성 코드는 우리가 고치는 대상이 아니다(.gitignore에도 있다).
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - "**/*.mocks.dart"
    - "**/build/**"
    - "**/.dart_tool/**"

  errors:
    # ── 경계 규칙 관련: 경고가 아니라 실패여야 하는 것 ──────────────────────
    # pubspec에 없는 패키지를 import 하는 것을 막는다. `ui_*`가 core_engine을
    # 우연히 import 하는 경로 하나를 여기서 미리 끊는다(C-3 보조).
    depend_on_referenced_packages: error
    # 릴리스 코드의 print. 로그는 진단 채널로만 나가야 한다.
    avoid_print: error
    # ⚠️ 「enum 값이 늘었는데 switch가 조용히 넘어감」(C-12)은 Dart 3에서
    #    이미 컴파일 오류(non_exhaustive_switch_*)라 따로 켤 규칙이 없다.
    #    단, `default:`를 적으면 그 보호가 사라진다 — C-12가 그것을 검사한다.

    # ── 생성 코드와의 마찰 완화 ────────────────────────────────────────────
    # freezed·json_serializable가 붙이는 애너테이션 위치 경고. 우리 잘못이 아니다.
    invalid_annotation_target: ignore
    # TODO 주석은 정보로만 남긴다(melos analyze가 --fatal-infos 라서 명시 필요).
    todo: ignore

linter:
  rules:
    # ── 계약을 눈에 보이게 ────────────────────────────────────────────────
    always_declare_return_types: true
    avoid_dynamic_calls: true
    prefer_final_locals: true
    prefer_final_in_for_each: true
    unnecessary_lambdas: true
    use_super_parameters: true

    # ── 조용한 실패 방지 ──────────────────────────────────────────────────
    # 기다리지 않은 Future = 순서가 어긋난 주문·쓰기. 엔진 쪽에서 특히 중요.
    unawaited_futures: true
    only_throw_errors: true
    avoid_slow_async_io: true
    cancel_subscriptions: true
    close_sinks: true
    test_types_in_equals: true
    throw_in_finally: true

    # ── 읽기 쉬움(리뷰 비용) ──────────────────────────────────────────────
    directives_ordering: true
    sort_pub_dependencies: true
    prefer_single_quotes: true
    unnecessary_parenthesis: true

    # ⚠️ 의도적으로 켜지 않은 것:
    #   public_member_api_docs — 뼈대 단계에서는 소음이 이득보다 크다.
    #   require_trailing_commas — 포맷터가 이미 잡는 범위와 겹친다.
    #   위 둘은 M2 계약 확정(G3) 뒤 domain_contracts 한정으로 재검토한다.
