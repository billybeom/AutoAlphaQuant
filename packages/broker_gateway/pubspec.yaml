name: broker_gateway
description: >-
  AutoAlphaQuant M1 브로커 게이트웨이. KIS 토큰·유량 제어·멱등 주문 발주를
  담당하며 화면(ui_*)을 의존하지 않는다.
publish_to: none
version: 0.1.0

environment:
  # ✅ 실측 확정(2026-09-08 · docs/toolchain_notes.md §1·§2-3): Dart 3.13.2 / Flutter 3.47.2.
  #    🔴 저장소 13개 pubspec이 같은 값이다 — 한 곳만 다르면 해석이 조용히 갈린다(SETUP §4-6).
  sdk: ^3.13.0

dependencies:
  # 🔴 ui_*를 의존하지 않는다. 주문 경로가 화면을 알면 안 된다.
  core_engine:
    path: ../core_engine
  # 🆕 E10d(설계 13 §8 R37 Y1) — core 주문 포트의 금액 타입(예수금 · 체결 금액). 01 §1-1 개정은 다음 계약 창(crypto 선례).
  decimal: ^3.0.0
  domain_contracts:
    path: ../domain_contracts
  # 🆕 E8d2a(설계 13 §8 R29 L10 · 01 §1-1 v1.14 허용) — KIS REST. data_sync(FRED·OFR)와 같은 `http` 하나만 쓴다(`dio` 아님).
  http: ^1.6.0

# 🔴 알파벳 순서를 지킬 것 — sort_pub_dependencies + --fatal-infos.
dev_dependencies:
  # ⚠️ 루트 analysis_options.yaml의 package: include 해석용(Flutter를 끌어오지 않는다).
  flutter_lints: ^5.0.0
  test: ^1.25.0
