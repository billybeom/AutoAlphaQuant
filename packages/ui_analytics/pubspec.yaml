name: ui_analytics
description: >-
  AutoAlphaQuant M7 화면 패키지. 성과·리밸런싱 이력·입출금 플래너를 그린다.
  계약(domain_contracts)이 준 값을 표시만 하며 재계산하지 않는다.
publish_to: none
version: 0.1.0

environment:
  # ✅ 실측 확정(2026-09-08 · docs/toolchain_notes.md §1·§2-3): Dart 3.13.2 / Flutter 3.47.2.
  #    🔴 저장소 13개 pubspec이 같은 값이다 — 한 곳만 다르면 해석이 조용히 갈린다(SETUP §4-6).
  sdk: ^3.13.0
  flutter: ">=3.47.0"

# 🔴 허용 목록은 아래 셋이 전부다(01 §1-1). core_engine·decimal·sqflite·
#    supabase_flutter·http를 추가하면 C-3이 빌드를 실패시킨다.
# 🔴 알파벳 순서를 지킬 것 — sort_pub_dependencies + --fatal-infos.
# 🔴 차트 라이브러리는 쓰지 않는다(계약 v1.3 · 2026-09-28 확정) — CustomPaint 로 직접
#    그린다. 대부분의 차트 라이브러리는 null을 조용히 이어 그린다(C-10 위반).
#    본보기 코드 = test/golden/reference/ · 증명 = test/golden/chart_probe.dart.
dependencies:
  domain_contracts:
    path: ../domain_contracts
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.0 # ⚠️ 전 ui_*가 같은 메이저를 쓸 것

dev_dependencies:
  # ⚠️ 루트 analysis_options.yaml의 package: include 해석용.
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter
