name: domain_contracts
description: >-
  AutoAlphaQuant M2 도메인 계약. 화면(ui_*)이 의존하는 유일한 인터페이스로
  DTO·열거형·리포지토리·명령 API·픽스처를 담는다. 순수 Dart이며 Flutter를
  의존하지 않는다.
publish_to: none
version: 0.1.0

environment:
  # ✅ 저장소 전체가 ^3.5.0으로 통일돼 있다(루트·packages·apps — 2026-09-06 정리).
  #    01 §1-1의 «≥3.3 전제»는 extension type(Ratio·TradeDate) 하한이고 ^3.5.0은
  #    그것을 만족한다. ⚠️ SDK 설치 후 실제 버전에 맞춰 좁힐 것 — docs/SETUP.md §4-6.
  sdk: ^3.5.0

dependencies:
  # 01 §1-1 허용 목록 그대로. 🔴 여기에 flutter·core_engine·sqflite·supabase를
  #    넣는 순간 계약이 플랫폼에 묶이고 viewer 빌드가 깨진다.
  decimal: ^3.0.0 # ⚠️ 2.x와 API가 다르다(Decimal.parse·Decimal.one 동일, 연산 반환형 차이). SDK 설치 후 확정
  freezed_annotation: ^2.4.0 # ⚠️ freezed 3.x로 올리면 annotation도 3.x로 함께 올려야 한다
  json_annotation: ^4.9.0
  meta: ^1.15.0

# 🔴 알파벳 순서를 지킬 것 — 루트 analysis_options.yaml의 sort_pub_dependencies가
#    켜져 있고 melos analyze는 --fatal-infos라 순서가 어긋나면 **분석이 실패**한다.
dev_dependencies:
  build_runner: ^2.4.0 # melos run build:gen이 dependsOn: build_runner로 이 패키지를 고른다
  # ⚠️ 루트 analysis_options.yaml의 `package:flutter_lints/...` include는 **이
  #    패키지의** package config로 해석된다. 여기 없으면 include가 조용히 실패하고
  #    lint가 꺼진 채로 통과한다(루트 파일의 같은 ⚠️ 주석 참조).
  #    flutter_lints는 규칙 YAML만 담은 순수 Dart 패키지라 Flutter를 끌어오지 않는다.
  flutter_lints: ^5.0.0
  freezed: ^2.5.0 # ⚠️ freezed_annotation과 메이저를 맞출 것
  json_serializable: ^6.8.0
  test: ^1.25.0
