name: data_sync
description: >-
  AutoAlphaQuant M4·X1·X4·X5 동기화 계층. 로컬 SQLite 정본 읽기·Supabase 읽기 모델·
  키 금고·정합 검사 구현체를 담으며 화면(ui_*)을 의존하지 않는다.
publish_to: none
version: 0.1.0

environment:
  # ✅ 실측 확정(2026-09-08 · docs/toolchain_notes.md §1·§2-3): Dart 3.13.2 / Flutter 3.47.2.
  #    🔴 저장소 13개 pubspec이 같은 값이다 — 한 곳만 다르면 해석이 조용히 갈린다(SETUP §4-6).
  sdk: ^3.13.0

dependencies:
  # 🔴 ui_*를 의존하지 않는다.
  core_engine:
    path: ../core_engine
  domain_contracts:
    path: ../domain_contracts
  # 로컬 정본 SQLite 드라이버 — 순수 Dart FFI(설계 13 §8 R19 E9-12 · 발주자 결정 2026-10-21).
  #    빌드 훅이 SQLite 실행 파일을 받아 패키지에 고정된 sha256 으로 검증한다(Android 포함).
  #    Flutter 플러그인이 아니라서 이 패키지는 순수 Dart(test:dart)에 남는다.
  # ✅ 01 §1-1 `data_sync` 허용 목록 = `sqlite3`(계약 v1.9 · E9a). `supabase_flutter` 는 E11(배치 D 실적용).
  sqlite3: ^3.7.1

# 🔴 알파벳 순서를 지킬 것 — sort_pub_dependencies + --fatal-infos.
dev_dependencies:
  # ⚠️ 루트 analysis_options.yaml의 package: include 해석용(Flutter를 끌어오지 않는다).
  flutter_lints: ^5.0.0
  test: ^1.25.0
