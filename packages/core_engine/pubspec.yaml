name: core_engine
description: >-
  AutoAlphaQuant M1·M3 계산 엔진. 신호·목표비중·리스크 한도·What-if 시뮬레이션을
  담당하는 순수 Dart 패키지이며 화면(ui_*)을 의존하지 않는다.
publish_to: none
version: 0.1.0

environment:
  # ⚠️ 저장소 전체가 ^3.5.0으로 통일돼 있다(루트·packages·apps).
  #    SDK 설치 후 실제 버전에 맞춰 좁힐 것 — docs/SETUP.md §4-6.
  sdk: ^3.5.0

dependencies:
  # 01 §1-1 허용 목록. 🔴 ui_*를 의존하지 않는다 — 계산이 화면을 알면 안 된다.
  decimal: ^3.0.0 # ⚠️ 규약 5조(곱셈 선행·Decimal.one 뺄셈)의 실행 주체가 이 패키지다
  domain_contracts:
    path: ../domain_contracts

# 🔴 알파벳 순서를 지킬 것 — sort_pub_dependencies + --fatal-infos.
dev_dependencies:
  # ⚠️ 루트 analysis_options.yaml의 package: include를 이 패키지에서도 풀 수 있게.
  #    규칙 YAML만 담은 순수 Dart 패키지라 Flutter를 끌어오지 않는다.
  flutter_lints: ^5.0.0
  test: ^1.25.0
