name: core_engine
description: >-
  AutoAlphaQuant M1·M3 계산 엔진. 신호·목표비중·리스크 한도·What-if 시뮬레이션을
  담당하는 순수 Dart 패키지이며 화면(ui_*)을 의존하지 않는다.
publish_to: none
version: 0.1.0

environment:
  # ✅ 실측 확정(2026-09-08 · docs/toolchain_notes.md §1·§2-3): Dart 3.13.2 / Flutter 3.47.2.
  #    🔴 저장소 13개 pubspec이 같은 값이다 — 한 곳만 다르면 해석이 조용히 갈린다(SETUP §4-6).
  sdk: ^3.13.0

dependencies:
  # 01 §1-1 허용 목록. 🔴 ui_*를 의존하지 않는다 — 계산이 화면을 알면 안 된다.
  # SHA-256 — 멱등키(04 §3-2 · GV-9). dart-lang 이 관리하는 순수 Dart 패키지(발주자 결정 2026-10-20).
  # ✅ 01 §1-1 의 core_engine 허용 목록에 등재됐다(계약 v1.9 · 설계 13 §7 P-9).
  crypto: ^3.0.7
  decimal: ^3.0.0 # ⚠️ 규약 5조(곱셈 선행·Decimal.one 뺄셈)의 실행 주체가 이 패키지다
  domain_contracts:
    path: ../domain_contracts

# 🔴 알파벳 순서를 지킬 것 — sort_pub_dependencies + --fatal-infos.
dev_dependencies:
  # ⚠️ 루트 analysis_options.yaml의 package: include를 이 패키지에서도 풀 수 있게.
  #    규칙 YAML만 담은 순수 Dart 패키지라 Flutter를 끌어오지 않는다.
  flutter_lints: ^5.0.0
  test: ^1.25.0

# 🆕 E11o-d(설계 13 §8 R167 · R162 A1) — 기기 골든 실행기의 벡터 자산. 🔵 의존이 아니다 — 이 패키지는 순수 Dart 그대로다
#    (data_sync 운영 설정 자산 선례 · Flutter 앱이 `packages/core_engine/test/golden/vectors/<파일>` 로 읽는다).
# 🔴 실행기 선언 파일만(`kDeviceGoldenSuite.files`) · 26년 재현 · 세션 달력 · 원천 대조 파일은 싣지 않는다.
# 🔴 목록 = 시험 `test/golden/golden_assets_test.dart` 가 실행기 선언과 대조한다(빠짐 · 남음 = 실패).
