name: ui_settings
description: >-
  AutoAlphaQuant M9 화면 패키지. 설정·자격증명·계좌 매핑·기기·연결·백업 화면을
  그린다. 실행·검증·저장은 주입된 SettingsActions에 위임한다.
publish_to: none
version: 0.1.0

environment:
  # ⚠️ 저장소 전체가 ^3.5.0으로 통일돼 있다(루트·packages·apps).
  #    SDK 설치 후 실제 버전에 맞춰 좁힐 것 — docs/SETUP.md §4-6.
  sdk: ^3.5.0
  flutter: ">=3.24.0" # ⚠️ 설치 버전 확인 후 확정

# 🔴 허용 목록은 아래 셋이 전부다(01 §1-1). 🔴 특히 설정 화면이라고 해서
#    supabase_flutter·sqflite·http를 넣지 않는다 — 저장·검증은 전부
#    SettingsActions(주입 콜백) 뒤에 있고 구현체는 data_sync 소유다.
# 🔴 알파벳 순서를 지킬 것 — sort_pub_dependencies + --fatal-infos.
dependencies:
  domain_contracts:
    path: ../domain_contracts
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.0 # ⚠️ 전 ui_*가 같은 메이저를 쓸 것

dev_dependencies:
  # ⚠️ 루트 analysis_options.yaml의 package: include 해석용.
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter
