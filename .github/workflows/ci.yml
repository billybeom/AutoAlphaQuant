# AutoAlphaQuant — 지속 통합(CI)
#
# 이 파일이 하는 일: 경계 규칙(00_README §5)과 계약 회귀 테스트(01 §7 C-1~C-16)를
# 사람의 기억이 아니라 «빌드 실패»로 강제한다. 화면 담당 AI의 PR은 여기를
# 통과하지 못하면 검수 대화 자체를 시작하지 않는다(07 §9 기계적 검사 1·2·4·5).
#
# 잡 3개로 나눈 이유: SDK가 필요 없는 검사(boundaries·golden)를 build와 **동시에**
# 돌려 「10분 기다렸다가 pubspec 한 줄 때문에 실패」를 피한다.
#   🔴 셋은 `needs:`로 묶여 있지 않다 = 병렬이다. 일부러 그렇게 뒀다 — 직렬로 묶으면
#      한 번에 한 가지 실패만 보이고, 세 게이트 전부 통과해야 병합된다는 사실은
#      브랜치 보호의 required checks가 강제한다(docs/SETUP.md §5-1).
#   실행 순서 자체는 build 잡 안에서 bootstrap → build:gen → format → analyze → test다.
#
# ✅ 2026-09-06: 패키지 13개(packages/ 10 · apps/ 3)가 실재한다. 그래도 build 잡의
#    「패키지 존재 확인」 가드는 남겨 둔다 — 폴더가 통째로 비는 브랜치(예: Q-D로
#    app_viewer_web 삭제 중)에서도 CI가 죽지 않게 하는 안전판이다.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # 🔴 한글 리터럴 검사(C-5)가 로케일에 의존한다. 지정하지 않으면 검사가
  #    조용히 0건을 보고한다.
  LANG: C.UTF-8

jobs:
  # ── 1. 경계 규칙 — SDK 불필요, 수 초 ──────────────────────────────────────
  boundaries:
    name: 경계 규칙 (C-3 · C-5)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: check_boundaries.sh
        run: bash tool/check_boundaries.sh

  # ── 2. 골든 스냅샷 위조 방지 — SDK 불필요 ─────────────────────────────────
  # 규칙(01 §7 · 07 §9-4): 신규 골든의 «추가»는 정상, 기존 골든의 «수정»은 실패.
  # 픽스처가 그대로인데 스냅샷을 다시 찍는 것은 계약이 바뀐 것을 덮는 행위다.
  #
  # 🔴 정당한 갱신 경로가 있어야 규칙이 지켜진다 — 표시 계약을 의도적으로 바꿨다면
  #    PR에 라벨 `golden:approved` 를 붙인다(누가 왜 바꿨는지가 PR에 남는다).
  #    라벨 없이 통과시킬 방법은 없다.
  golden:
    name: 골든 스냅샷 (C-1 · C-2 무결성)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 수정된 골든 파일 탐지
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          APPROVED: ${{ contains(github.event.pull_request.labels.*.name, 'golden:approved') }}
        run: |
          set -u
          # 🔴 세 점(...)이다 = base와 head의 **공통 조상**부터 비교한다(07 §9-4가
          #    지정한 형태). 두 점으로 비교하면 PR이 열린 뒤 main에 들어간 남의
          #    골든 변경까지 이 PR의 «수정»으로 잡혀 애먼 반려가 난다.
          #    fetch-depth: 0 이라야 공통 조상을 찾을 수 있다(위 checkout 설정).
          # 🔴 대상은 «스냅샷 산출물»뿐이다 — 뷰모델 골든(*.golden.json)과 위젯 골든 PNG.
          #    구 규칙 '*golden*' 은 경로에 golden 이 든 **모든 파일**(test/golden/ 의 하네스 .dart·
          #    README 포함)을 스냅샷으로 취급해, M2 가 비교기 코드를 고친 PR 을 «골든 수정»으로
          #    오탐했다(2026-09-17 PR #2). 고칠 수 없는 조건으로 점검을 실패시키지 않는다.
          CHANGED=$(git diff --name-status "$BASE_SHA...$HEAD_SHA" -- '*.golden.json' '*/test/golden/*.png' '*/goldens/*' || true)
          if [ -z "$CHANGED" ]; then
            echo "✅ 골든 파일 변경 없음"
            exit 0
          fi
          echo "── 골든 파일 변경 목록"
          echo "$CHANGED"
          # A = 추가(허용) / M = 수정 / D = 삭제 / R = 이름 변경 → 허용하지 않음
          TOUCHED=$(echo "$CHANGED" | grep -E '^(M|D|R[0-9]*)' || true)
          if [ -z "$TOUCHED" ]; then
            echo "✅ 신규 추가만 있다 — 허용(01 §7 «최초 생성»)"
            exit 0
          fi
          echo "── 수정·삭제된 골든:"
          echo "$TOUCHED"
          if [ "$APPROVED" = "true" ]; then
            echo "🟡 라벨 golden:approved 가 붙어 있어 통과시킨다. PR 본문에 «무엇이 왜 바뀌었는가»가 적혀 있어야 한다."
            exit 0
          fi
          echo "❌ 기존 골든 스냅샷이 수정·삭제됐다."
          echo "   픽스처가 그대로인데 스냅샷을 다시 찍는 것은 위조다(01 §7)."
          echo "   표시 계약을 의도적으로 바꾼 것이라면 PR에 라벨 golden:approved 를 붙이고"
          echo "   PR 본문에 바뀐 필드와 이유를 적어라."
          exit 1

  # ── 3. 빌드·분석·테스트 ───────────────────────────────────────────────────
  build:
    name: 분석 · 테스트 (melos)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 패키지 존재 확인
        id: probe
        run: |
          set -u
          # pubspec.yaml 을 가진 하위 패키지가 하나라도 있는가
          COUNT=$(find packages apps -mindepth 2 -maxdepth 2 -name pubspec.yaml 2>/dev/null | wc -l)
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          if [ "$COUNT" -eq 0 ]; then
            echo "ℹ️ 아직 패키지가 없다(G3·G4 이전). Dart 단계를 건너뛴다."
          else
            echo "패키지 $COUNT 개 발견 — 전 단계를 돈다."
          fi

      - uses: subosito/flutter-action@v2
        if: steps.probe.outputs.count != '0'
        with:
          channel: stable
          cache: true

      - name: melos 설치
        if: steps.probe.outputs.count != '0'
        run: |
          dart pub global activate melos
          echo "$HOME/.pub-cache/bin" >> "$GITHUB_PATH"

      - name: 버전 기록
        if: steps.probe.outputs.count != '0'
        run: |
          flutter --version
          dart --version
          melos --version

      - name: bootstrap
        if: steps.probe.outputs.count != '0'
        run: melos bootstrap

      # 생성 코드(*.g.dart·*.freezed.dart)는 커밋하지 않으므로 여기서 만든다.
      - name: 코드 생성
        if: steps.probe.outputs.count != '0'
        run: melos run build:gen

      - name: 포맷
        if: steps.probe.outputs.count != '0'
        run: melos run format

      - name: 정적 분석 (경고 0)
        if: steps.probe.outputs.count != '0'
        run: melos run analyze

      - name: 테스트 (계약 회귀 C-1~C-16 포함)
        if: steps.probe.outputs.count != '0'
        run: melos run test
