# AutoAlphaQuant 모노레포 루트
#
# 🔴 여기에는 앱 코드가 없다. 이 pubspec은 오직 개발 도구(melos·lint 규칙)를
#    선언하기 위한 것이다. 실제 코드는 packages/ 와 apps/ 아래에 있다.

name: autoalphaquant_workspace
description: >-
  AutoAlphaQuant 모노레포 루트. 도구 의존만 선언하며 배포되지 않는다.
publish_to: none
version: 0.1.0

environment:
  # 🔴 저장소 전체가 한 값을 쓴다 — packages/ 10개·apps/ 3개 모두 ^3.13.0이다.
  #    하한이 3.13인 이유는 「최신이라서」가 아니라 domain_contracts의 생성기가
  #    요구해서다(freezed 4 · json_serializable 6.14의 언어 버전 게이트 —
  #    docs/toolchain_notes.md §2-2). 01 §1-1의 «≥3.3 전제»(extension type)도 만족한다.
  # ✅ 실측 확정(2026-09-08): Dart 3.13.2 / Flutter 3.47.2.
  sdk: ^3.13.0

# 🔴 알파벳 순서를 지킬 것 — analysis_options.yaml의 sort_pub_dependencies가
#    켜져 있다(flutter_lints가 melos보다 앞).
dev_dependencies:
  # analysis_options.yaml의 `include:`가 이 패키지를 해석할 수 있어야 한다.
  flutter_lints: ^5.0.0
  # ✅ 실측 확정(2026-09-08): 이 제약으로 저장소 안에서 **6.3.3** 이 잡힌다.
  #    해석 방식은 melos.yaml 머리 주석 대로 고전 `packages:` 글롭 하나다.
  #    하한을 실측값으로 올려 둔다 — pubspec.lock 을 커밋하지 않으므로
  #    하한이 유일한 재현 장치다(docs/toolchain_notes.md §5 #10).
  melos: ^6.3.3

# ⚠️ pub workspace로 전환할 경우(Dart 3.6+):
#   resolution 을 각 패키지에 `resolution: workspace`로 넣고, 여기에
#   workspace:
#     - packages/domain_contracts
#     - ... (전 패키지)
#   를 나열한 뒤 melos.yaml의 `packages:` 글롭을 지운다. 두 방식을 동시에 두지 말 것.
