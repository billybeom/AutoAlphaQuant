# AutoAlphaQuant 모노레포 루트
#
# 🔴 여기에는 앱 코드가 없다. 이 pubspec은 오직 개발 도구(melos·lint 규칙)를
#    선언하기 위한 것이다. 실제 코드는 packages/ 와 apps/ 아래에 있다.

name: autoalphaquant_workspace
description: >-
  AutoAlphaQuant 모노레포 루트. 도구 의존만 선언하며 배포되지 않는다.
publish_to: none
version: 0.1.0

environment:
  # 🔴 저장소 전체가 한 값을 쓴다 — packages/ 10개·apps/ 3개 모두 ^3.5.0이다.
  #    하한 3.3은 01 §1-1의 전제(extension type — Ratio·TradeDate)이고 ^3.5.0은
  #    그것을 만족한다. 루트와 패키지가 다른 하한을 말하는 상태를 두지 말 것.
  # ⚠️ SDK 설치 후 실제 버전에 맞춰 좁힐 것(docs/SETUP.md §4-6).
  sdk: ^3.5.0

# 🔴 알파벳 순서를 지킬 것 — analysis_options.yaml의 sort_pub_dependencies가
#    켜져 있다(flutter_lints가 melos보다 앞).
dev_dependencies:
  # analysis_options.yaml의 `include:`가 이 패키지를 해석할 수 있어야 한다.
  flutter_lints: ^5.0.0
  # ⚠️ 버전 미확정 — 설치된 melos 버전을 확인한 뒤 정확히 고정할 것.
  #    6.x와 3~5.x는 melos.yaml 해석이 다르다(pub workspace 여부).
  melos: ^6.0.0

# ⚠️ pub workspace로 전환할 경우(Dart 3.6+):
#   resolution 을 각 패키지에 `resolution: workspace`로 넣고, 여기에
#   workspace:
#     - packages/domain_contracts
#     - ... (전 패키지)
#   를 나열한 뒤 melos.yaml의 `packages:` 글롭을 지운다. 두 방식을 동시에 두지 말 것.
