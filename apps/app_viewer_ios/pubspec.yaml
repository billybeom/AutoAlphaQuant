# app_viewer_ios — viewer 타깃 (읽기 전용 + 킬스위치 «발동»만)
#
# 🔴 이 목록에 `trading_runtime`·`broker_gateway`·`core_engine`·🆕 `data_sync` 가 **없는 것이 사양**이다
#    (직접이든 전이든 — tool/check_boundaries.sh [8]).
#    없으므로 이 타깃에서는 주문 코드를 부를 방법이 애초에 없다(00_README §5 경계 규칙 ③).
#    "쓰지 않기로 했다"가 아니라 "컴파일되지 않는다"여야 코드 리뷰에 기대지 않는다.
#
# 🔴 의존은 **알파벳 순서**로만 적는다(sort_pub_dependencies + --fatal-infos).
#    어느 줄이 무슨 뜻인지는 줄 주석과 docs/TARGETS.md 매트릭스가 말한다.
# ⚠️ 이 PC에 Flutter·Dart가 없어 해석 검증을 하지 못했다(2026-09-06). 버전은 범위로 둔다.

name: app_viewer_ios
description: >-
  AutoAlphaQuant viewer 타깃(iOS). 읽기 전용 조회 + 저널 작성 + 킬스위치 발동.
  엔진·주문·브로커 키는 이 앱에 없다.
publish_to: none
version: 0.1.0

environment:
  # ✅ packages/ 쪽 하한(^3.13.0)과 맞춘 값이다 — 앱만 낮추면 해석이 실패한다.
  #    실측 확정(2026-09-08 · docs/toolchain_notes.md §1): Dart 3.13.2 / Flutter 3.47.2.
  sdk: ^3.13.0
  flutter: ">=3.47.0"

# ── 의존 (알파벳 순) ────────────────────────────────────────────────────────
dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.0
  # 읽기 모델 — 🔴 **뷰어 전용 읽기 패키지**(🆕 설계 13 §8 R53 · 지도 D1 · 발주자 결정 2026-11-04).
  #   `data_sync` 는 operator 전용이다 — 넣으면 `core_engine`(엔진 · 원장)이 전이로 들어온다(지도 X1).
  #   viewer 가 남기는 것은 append-only 명령·이벤트뿐이며 서버 RLS 가 한 번 더 막는다(01 §6-4).
  #   🔴 tool/check_boundaries.sh [8] 이 이 앱의 전이 의존 그래프를 본다.
  read_model_client:
    path: ../../packages/read_model_client
  ui_analytics:
    path: ../../packages/ui_analytics
  ui_journal:
    path: ../../packages/ui_journal
  # 킬스위치 «발동»만 — 결정 6("끄기는 쉽게, 켜기는 어렵게").
  # 🔴 패키지 의존은 허용하되 **해제(48h 대기·체크리스트 7항) 화면은 이 앱의 위젯 트리에
  #    넣지 않는다.** 진짜 빌드 제외가 되려면 ui_safety가 발동 전용 진입점 라이브러리를
  #    따로 내놔야 한다 — README §4의 ⚠️ 계약 요청 참조(M5 소유 · docs/TARGETS.md T-1).
  ui_safety:
    path: ../../packages/ui_safety
  # 🔴 ui_settings는 viewer에서도 필요하지만(연결 상태·기기 목록 조회) **키 입력 화면은
  #    빌드 대상이 아니다** — README «빌드 제외 규칙» · docs/TARGETS.md T-2.
  ui_settings:
    path: ../../packages/ui_settings
  ui_shell:
    path: ../../packages/ui_shell

dev_dependencies:
  # 🔴 알파벳 순 — flutter_lints가 flutter_test보다 앞이다.
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
