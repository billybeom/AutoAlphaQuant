# app_operator_android — operator 타깃 (Android 폰 1대)
#
# 이 타깃만 엔진을 돌리고 주문을 낸다(청사진 결정 1·2·6). 나머지 타깃은 읽기 전용
# viewer이며 브로커·주문·키 코드가 **의존 목록에 아예 없어서** 빌드에 들어가지 못한다
# (00_README §5 경계 규칙 ③ — "코드 리뷰로 대체 불가").
#
# 🔴 여기는 «조립만» 하는 자리다. 계산·판정·사유 문구는 어느 것도 이 패키지에 없다.
# 🔴 의존은 **알파벳 순서**로만 적는다 — 루트 analysis_options.yaml의
#    sort_pub_dependencies가 켜져 있고 melos analyze는 --fatal-infos라, 순서가
#    어긋나면 «분석 실패»다. 그래서 «화면 5개»·«엔진·동기화»처럼 의미로 묶어
#    나열할 수 없다. 어느 줄이 무슨 뜻인지는 줄 주석과 docs/TARGETS.md 매트릭스가 말한다.
# ⚠️ 이 PC에 Flutter·Dart가 없어 `flutter pub get`으로 검증하지 못했다(2026-09-06).
#    버전 제약은 범위로 두었고, SDK 설치 후 실제 해석 결과에 맞춰 좁힌다.

name: app_operator_android
description: >-
  AutoAlphaQuant operator 타깃. 엔진(trading_runtime)·동기화(data_sync)와
  전 화면 패키지를 한 앱으로 조립한다. Android 폰 전용.
publish_to: none
version: 0.1.0

environment:
  # ✅ packages/ 10개가 전부 ^3.13.0을 요구하므로 앱도 같은 하한을 쓴다. 앱만 낮게
  #    두면 «앱 제약은 만족하는데 의존 패키지가 해석되지 않는» 상태가 SDK 설치 후에야
  #    드러난다. (01 §1-1의 «≥3.3 전제»는 extension type 하한이고 ^3.13.0은 그것을 만족한다.)
  #    실측 확정(2026-09-08 · docs/toolchain_notes.md §1): Dart 3.13.2 / Flutter 3.47.2.
  sdk: ^3.13.0
  flutter: ">=3.47.0"

# ── 의존 (알파벳 순) ────────────────────────────────────────────────────────
# 🔴 여기 있는 것만 이 앱에 컴파일된다. 타깃×패키지 전체 매트릭스는 docs/TARGETS.md.
dependencies:
  # 동기화 — operator는 읽기+쓰기(viewer는 읽기 전용 표면만).
  data_sync:
    path: ../../packages/data_sync
  flutter:
    sdk: flutter
  # 상태관리 — 청사진 채택(00_README §4)
  # ⚠️ riverpod 3.x가 나와 있으면 마이그레이션 여부를 먼저 결정한다. 지금은 2.x 계열.
  flutter_riverpod: ^2.5.0
  # 🔴 엔진 — trading_runtime이 core_engine·broker_gateway를 전이로 끌고 온다.
  #    그래서 이 한 줄은 «operator 타깃에만» 존재해야 한다. viewer에 들어가는 순간
  #    브로커 키·주문 코드가 뷰어 바이너리에 컴파일된다.
  trading_runtime:
    path: ../../packages/trading_runtime
  ui_analytics:
    path: ../../packages/ui_analytics
  ui_journal:
    path: ../../packages/ui_journal
  # 🔴 operator만 ui_safety·ui_settings의 **전체**를 싣는다. viewer는 ui_safety를
  #    「킬스위치 발동」 진입점만 쓰고 해제 화면은 빌드에서 뺀다(README «빌드 제외 규칙»).
  ui_safety:
    path: ../../packages/ui_safety
  ui_settings:
    path: ../../packages/ui_settings
  ui_shell:
    path: ../../packages/ui_shell

  # ⚠️ domain_contracts는 위 패키지들을 통해 전이로 들어온다. 리포지토리 구현체를
  #    Riverpod 프로바이더에 주입하기 시작하면(조립 코드가 계약 타입을 직접 참조하면)
  #    `depend_on_referenced_packages` 린트가 뜨므로 그때 아래를 살린다.
  #    🔴 살릴 때는 알파벳 순서대로 data_sync 위(맨 앞)에 넣는다.
  # domain_contracts:
  #   path: ../../packages/domain_contracts

dev_dependencies:
  # 🔴 알파벳 순 — flutter_lints가 flutter_test보다 앞이다.
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  # ⚠️ assets·fonts는 화면이 실제로 필요로 할 때 추가한다. 지금 비워 두는 것이 사양이다.
